<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel | trustTech</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/nav.css" />
    <link rel="stylesheet" href="../../assets/css/animations.css" />
    <link rel="stylesheet" href="../../assets/css/responsive.css" />
    <link rel="stylesheet" href="../../assets/css/service-pages.css" />

    <style>
      .admin-main {
        padding: calc(var(--nav-h) + 2.8rem) 0 4rem;
      }

      .admin-shell {
        max-width: 920px;
        margin: 0 auto;
        display: grid;
        gap: 1rem;
      }

      .admin-head {
        text-align: center;
        margin-bottom: 0.4rem;
      }

      .admin-card {
        background: linear-gradient(145deg, rgba(23, 31, 51, 0.9), rgba(34, 42, 61, 0.84));
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 1.3rem;
        box-shadow: 0 18px 34px rgba(5, 10, 24, 0.34);
      }

      .admin-grid {
        display: grid;
        gap: 0.9rem;
      }

      .admin-grid label {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.84rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #d5e1f6;
      }

      .admin-grid textarea {
        min-height: 110px;
        resize: vertical;
      }

      .admin-actions {
        margin-top: 0.2rem;
      }

      .admin-actions .btn {
        width: 100%;
      }

      #loginError {
        margin-top: 0.8rem;
        color: #ffd6dc;
        border: 1px solid rgba(255, 91, 129, 0.5);
        border-radius: 10px;
        background: rgba(148, 33, 59, 0.35);
        padding: 0.6rem 0.75rem;
      }

      #jobList h2 {
        margin-bottom: 0.75rem;
      }

      #jobs {
        list-style: none;
        display: grid;
        gap: 0.7rem;
      }

      #jobs li {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.75rem;
        background: rgba(19, 27, 46, 0.7);
        color: #d2def4;
        line-height: 1.55;
      }

      @media (max-width: 640px) {
        .admin-main {
          padding-top: calc(var(--nav-h) + 4.5rem);
        }

        .admin-card {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-nav">
      <div class="container nav-inner">
        <a href="../../index.html" class="logo-link" aria-label="trustTech Home">
          <img src="../../assets/media/trustech.png" alt="trustTech logo" class="site-logo" />
        </a>

        <ul class="nav-links" aria-label="Primary navigation">
          <li><a href="../../index.html" class="nav-link">Home</a></li>
          <li>
            <a href="open-positions.html" class="nav-link">Open Positions</a>
          </li>
          <li><a href="talent.html" class="nav-link">Talent</a></li>
          <li><a href="../../index.html#contact" class="nav-link">Contact</a></li>
        </ul>

        <div class="nav-actions"></div>
      </div>
    </header>

    <main class="admin-main">
      <div class="container admin-shell">
        <div class="admin-head reveal">
          <span class="section-label">Control Center</span>
          <h1>Admin Panel: Add New Job</h1>
          <p>Manage job postings without changing any backend behavior.</p>
        </div>

        <div id="loginSection" class="admin-card reveal">
          <h2>Admin Login</h2>
          <form id="loginForm" class="admin-grid" aria-label="Admin login form">
            <div>
              <label for="username">Username</label>
              <input type="text" id="username" name="username" required />
            </div>
            <div>
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required />
            </div>
            <div class="admin-actions">
              <button type="submit" class="btn btn-primary">Login</button>
            </div>
          </form>
          <div id="loginError" style="display: none">Invalid username or password.</div>
        </div>

        <div id="adminSection" class="admin-card reveal" style="display: none">
          <h2>Add Job Opening</h2>
          <form id="jobForm" class="admin-grid" aria-label="Job posting form">
            <div>
              <label for="title">Job Title</label>
              <input type="text" id="title" name="title" required />
            </div>

            <div>
              <label for="description">Description</label>
              <textarea id="description" name="description" required></textarea>
            </div>

            <div>
              <label for="location">Location</label>
              <input type="text" id="location" name="location" required />
            </div>

            <div>
              <label for="type">Job Type</label>
              <select id="type" name="type">
                <option value="Full-Time">Full-Time</option>
                <option value="Part-Time">Part-Time</option>
                <option value="Contract">Contract</option>
              </select>
            </div>

            <div class="admin-actions">
              <button type="submit" class="btn btn-primary">Add Job</button>
            </div>
          </form>

          <div id="jobList" style="margin-top: 1.2rem">
            <h2>Available Jobs</h2>
            <ul id="jobs"></ul>
          </div>
        </div>
      </div>
    </main>

    <script src="../../assets/js/admin.js"></script>
  </body>
</html>
